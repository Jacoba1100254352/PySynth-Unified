[tox]
envlist = py39, py310, py311, py312, py313, py314, flake8
skip_missing_interpreters = true

[travis]
python =
    3.14: py314
    3.13: py313
    3.12: py312
    3.11: py311
    3.10: py310
    3.9: py39

[testenv:flake8]
basepython = python
deps = flake8
commands = flake8 tomita tests

[testenv]
setenv =
    PYTHONPATH = {toxinidir}
deps =
    pytest>=7
commands =
    pip install -U pip
    pytest --basetemp={envtmpdir}

