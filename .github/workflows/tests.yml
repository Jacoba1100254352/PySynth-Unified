name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q
      - run: python -m compileall -q tomita pysynth tests

  quality:
    name: Package and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m flake8 tomita pysynth tests
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/pysynth-wheel
          /tmp/pysynth-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/pysynth-wheel/bin/pysynth list-sounds
          /tmp/pysynth-wheel/bin/tomita list-sounds
          /tmp/pysynth-wheel/bin/pysynth --song "32c4 32r" --sound beeper --output /tmp/pysynth-smoke.wav --quiet
          /tmp/pysynth-wheel/bin/python -c 'import wave; assert wave.open("/tmp/pysynth-smoke.wav", "rb").getnframes() > 0'
